name: Public VSM OSS metrics snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  pull_request:
    paths:
      - "metrics.yaml"
      - "METRICS.md"
      - "scripts/collect_public_metrics.py"
      - "scripts/finalize_public_metrics_windows.py"
      - "tests/test_public_metrics_collector.py"
      - "tests/test_finalize_public_metrics_windows.py"
      - "requirements-metrics.txt"
      - ".github/workflows/metrics-snapshot.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Organization
        uses: actions/checkout@v4
        with:
          path: organization
          fetch-depth: 0

      - name: Check out Profile
        uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-harness-profile
          ref: main
          path: profile
          fetch-depth: 0

      - name: Check out Skills
        uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-harness-skills
          ref: main
          path: skills
          fetch-depth: 0

      - name: Check out Index
        uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-harness-index
          ref: main
          path: index
          fetch-depth: 0

      - name: Check out Awesome
        uses: actions/checkout@v4
        with:
          repository: opensiro/awesome-vsm-harness
          ref: main
          path: awesome
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependency
        run: python -m pip install -r organization/requirements-metrics.txt

      - name: Run metrics tests
        working-directory: organization
        run: >-
          python -m unittest
          tests.test_public_metrics_collector
          tests.test_finalize_public_metrics_windows
          -v

      - name: Collect pinned public snapshot
        run: >-
          python organization/scripts/collect_public_metrics.py
          --profile-root profile
          --skills-root skills
          --index-root index
          --awesome-root awesome
          --organization-root organization
          --output vsm-oss-metrics.json

      - name: Finalize historical windows through repository-owned renderers
        run: >-
          python organization/scripts/finalize_public_metrics_windows.py
          --snapshot vsm-oss-metrics.json
          --index-root index

      - name: Publish snapshot summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("vsm-oss-metrics.json").read_text())
          print("## Public VSM OSS canonical growth")
          print()
          print(f"Collected at: `{data['collected_at']}`")
          print()
          print("| Repository | Primary state | 24h | 7d | 30d |")
          print("| --- | ---: | ---: | ---: | ---: |")
          for repo in data["scope"]:
              entry = data["repositories"][repo]
              name = entry["primary_metric"]
              metric = entry["metrics"].get(name)
              if metric is None:
                  current = "—"
                  cells = ["—", "—", "—"]
              else:
                  current = metric.get("value")
                  change = metric.get("window_change", {})
                  cells = []
                  for window in ("24h", "7d", "30d"):
                      item = change.get(window, {})
                      if item.get("value") is not None:
                          value = item["value"]
                          cells.append(f"{value:+d}" if isinstance(value, int) else str(value))
                      elif item.get("changed") is not None:
                          cells.append("changed" if item["changed"] else "—")
                      else:
                          cells.append("unclaimed")
              print(f"| `{repo}` | {current} | {cells[0]} | {cells[1]} | {cells[2]} |")
          print()
          print("Window values are net canonical-state change from the same repository-owned source at historical cutoffs, not gross event counts.")
          print("Historical gaps use the owning repository renderer; pre-inception cumulative stock uses a zero baseline.")
          print("Engineering activity remains separate and non-KPI.")
          PY

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsm-oss-metrics
          path: vsm-oss-metrics.json
          if-no-files-found: error
          retention-days: 30
